[project]
name = "actif-agentic-cti"
version = "0.1.0"
description = "AI-Powered Cyber Threat Intelligence Orchestrator using CrewAI for the n0z0 Deception Ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
